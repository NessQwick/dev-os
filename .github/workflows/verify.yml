# Build and verify a disposable, sanitized template, never the source checkout.
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check application and release contracts
        run: |
          node scripts/verify_life_os_app.mjs .
          node scripts/verify_assistant_contracts.mjs .
          python3 scripts/verify_release_safety.py

      - name: Build and verify sanitized template
        run: |
          python3 scripts/build_template.py --out "$RUNNER_TEMP/devos-output" --name DevOS-ci --version 1.1.0 --zip
          python3 scripts/verify_template.py "$RUNNER_TEMP/devos-output/DevOS-ci"
          python3 scripts/verify_archive_restore.py "$RUNNER_TEMP/devos-output/DevOS-ci-template-v1.1.0.zip"
